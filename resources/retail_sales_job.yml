resources:
  jobs:
    retail_sales_job:
      name: retail-sales-lakehouse-job
      email_notifications:
        on_failure:
          - "abuzafarghaffari@gmail.com"

      tasks:
        - task_key: bronze_ingestion
          spark_python_task:
            python_file: ../src/bronze/ingest_sales.py
          environment_key: default
        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion    
          max_retries: 2
          min_retry_interval_millis: 60000
          spark_python_task:
           python_file: ../src/silver/transform_sales.py  
          environment_key: default 
        - task_key: gold_aggregation
          depends_on: 
            - task_key: silver_transformation
          spark_python_task:
             python_file: ../src/gold/aggregate_sales.py
          environment_key: default   

      environments:
        - environment_key: default
          spec:
            environment_version: "2"